[project]
name = "recreator"
version = "0.1.0"
description = "Repurpose overseas videos to Chinese platforms — translator validation slice"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "pysubs2>=1.7",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1",
]

[project.scripts]
recreator-translate = "translate.cli:main"
recreator-download = "download.cli:main"
recreator-compose = "compose.cli:main"
recreator-publish = "publish.cli:main"
recreator-data = "data.cli:main"
recreator-monitor = "monitor.cli:main"
recreator-run = "orchestrate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["translate", "download", "orchestrate", "compose", "publish", "data", "monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["translate", "download", "orchestrate", "compose", "publish", "data", "monitor"]
