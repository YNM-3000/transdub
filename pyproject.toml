[project]
name = "recreator"
version = "0.1.0"
description = "Repurpose overseas videos to Chinese platforms — translator validation slice"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "pysubs2>=1.7",
    "python-dotenv>=1.0",
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
# Local speech-to-text fallback for videos whose captions can't be downloaded.
asr = ["faster-whisper>=1.0"]
# Chinese dubbing: edge-tts is the reliable default; Kokoro (local) is used
# first when installed + model files are present (see dub.backend).
dub = ["edge-tts>=7.0"]
dub-kokoro = ["kokoro-onnx>=0.4", "misaki[zh]>=0.9", "numpy>=1.26"]

[project.scripts]
recreator-translate = "translate.cli:main"
recreator-download = "download.cli:main"
recreator-compose = "compose.cli:main"
recreator-dub = "dub.cli:main"
recreator-publish = "publish.cli:main"
recreator-data = "data.cli:main"
recreator-monitor = "monitor.cli:main"
recreator-run = "orchestrate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/translate", "src/download", "src/orchestrate", "src/compose",
    "src/publish", "src/data", "src/monitor", "src/obs", "src/transcribe",
    "src/dub",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["translate", "download", "orchestrate", "compose", "publish", "data", "monitor", "obs", "transcribe", "dub"]
