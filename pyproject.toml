[project]
name = "recreator"
version = "0.1.0"
description = "Repurpose overseas videos to Chinese platforms — translator validation slice"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "pysubs2>=1.7",
    "python-dotenv>=1.0",
]

[project.scripts]
recreator-translate = "translate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["translate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["translate"]
